plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dalecopeland.drcvirtualgolfcaddie'
    compileSdk 35

    signingConfigs {
        release {
            storeFile file(System.getenv('DRC_KEYSTORE_FILE') ?: 'drc-release-key.jks')
            storePassword System.getenv('DRC_KEYSTORE_PASSWORD')
            keyAlias System.getenv('DRC_KEY_ALIAS')
            keyPassword System.getenv('DRC_KEY_PASSWORD')
        }
    }

    defaultConfig {
        applicationId 'com.dalecopeland.drcvirtualgolfcaddie'
        minSdk 26
        targetSdk 35
        versionCode 27
        versionName '2.0.7'
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
