name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html style.css app.js www/
      - name: Create Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Add Android permissions and install settings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perms = '''<uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          <uses-permission android:name="android.permission.RECORD_AUDIO" />
          <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n'''
          if 'ACCESS_FINE_LOCATION' not in s:
              s = s.replace('<application', perms + '<application', 1)
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug
      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DRC-VIRTUAL-GOLF-CADDIE-INSTALL-TEST
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
