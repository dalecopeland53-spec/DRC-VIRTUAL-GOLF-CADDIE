name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore permanent DRC signing key
        env:
          DRC_KEYSTORE_BASE64: ${{ secrets.DRC_KEYSTORE_BASE64 }}
        run: |
          test -n "$DRC_KEYSTORE_BASE64"
          echo "$DRC_KEYSTORE_BASE64" | base64 --decode > app/drc-release-key.jks

      - name: Copy DRC app into Android assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app.js style.css app/src/main/assets/

      - name: Build signed release APK
        env:
          DRC_KEYSTORE_FILE: drc-release-key.jks
          DRC_KEYSTORE_PASSWORD: ${{ secrets.DRC_KEYSTORE_PASSWORD }}
          DRC_KEY_ALIAS: ${{ secrets.DRC_KEY_ALIAS }}
          DRC_KEY_PASSWORD: ${{ secrets.DRC_KEY_PASSWORD }}
        run: |
          test -n "$DRC_KEYSTORE_PASSWORD"
          test -n "$DRC_KEY_PASSWORD"
          gradle :app:assembleRelease --no-daemon

      - name: Verify release signature and package
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | head -20

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DRC-Virtual-Golf-Caddie-Signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
