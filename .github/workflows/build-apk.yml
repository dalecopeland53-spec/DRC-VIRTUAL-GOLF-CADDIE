name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: |
          rm -rf www android
          mkdir -p www
          cp index.html style.css app.js www/
      - name: Create Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Configure Android package
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perms = '''<uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          <uses-permission android:name="android.permission.RECORD_AUDIO" />
          <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n'''
          if 'ACCESS_FINE_LOCATION' not in s:
              s = s.replace('<application', perms + '<application', 1)
          p.write_text(s)
          PY
      - name: Restore permanent signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > android/app/drc-release-key.jks
          test -s android/app/drc-release-key.jks

      - name: Configure permanent release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          printf 'DRC_RELEASE_STORE_FILE=drc-release-key.jks\n' >> android/gradle.properties
          printf 'DRC_RELEASE_STORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD" >> android/gradle.properties
          printf 'DRC_RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> android/gradle.properties
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          if 'DRC_RELEASE_STORE_FILE' not in s:
              s=s.replace('android {', """android {
    signingConfigs {
        release {
            storeFile file(DRC_RELEASE_STORE_FILE)
            storePassword DRC_RELEASE_STORE_PASSWORD
            keyAlias 'drc-golf-alias'
            keyPassword DRC_RELEASE_KEY_PASSWORD
        }
    }""", 1)
          s=s.replace('release {\n', 'release {\n            signingConfig signingConfigs.release\n', 1)
          p.write_text(s)
          PY

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew clean assembleRelease
      - name: Verify signed release APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" DRC-Virtual-Golf-Caddie-Signed-Release.apk
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: DRC-VIRTUAL-GOLF-CADDIE-SIGNED-RELEASE
          path: DRC-Virtual-Golf-Caddie-Signed-Release.apk
          if-no-files-found: error
