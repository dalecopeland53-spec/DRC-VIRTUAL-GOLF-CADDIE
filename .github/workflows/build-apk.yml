name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Force Clean App Infrastructure
        run: |
          rm -rf www android node_modules package-lock.json

      - name: Install clean Capacitor infrastructure
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets Mirror
        run: |
          mkdir -p www
          cp index.html style.css app.js www/

      - name: Scaffold Native Studio Wrappers
        run: npx cap add android

      - name: Inject Hardware Permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = """
          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          <uses-permission android:name="android.permission.RECORD_AUDIO" />
          <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
          """
          if "ACCESS_FINE_LOCATION" not in s:
              s = s.replace("<application", perms + "\n    <application", 1)
          p.write_text(s)
          PY

      - name: Sync App System
        run: npx cap sync android

      - name: Compile and Bundle Package
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Export Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: s24-ultra-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
