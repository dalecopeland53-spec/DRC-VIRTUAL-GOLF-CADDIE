name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Copy DRC app into Android assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app.js style.css app/src/main/assets/

      - name: Build native debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK package and signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | head -20

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DRC-Virtual-Golf-Caddie-Native
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

# Build trigger: confirmed installable native baseline
